# Host 默认配置；敏感值由环境变量提供。
spring:
  application:
    name: dedsi-arche
  # 默认连接 compose.yaml 中的本地 PostgreSQL。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/dedsi_arche}
    username: ${DB_USER:dedsi}
    password: ${DB_PASSWORD}
  # 仅校验表结构，结构变更统一交给 Flyway。
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Redis 连接及密码配置。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:63799}
      password: ${REDIS_PASSWORD}
  # 各业务模块的数据库迁移目录。
  flyway:
    locations: classpath:db/migration/system
# 接口文档开关与 JWT 签发配置。
app:
  docs:
    enabled: ${DOCS_ENABLED:true}
  jwt:
    issuer: dedsi-arche
    secret: ${JWT_SECRET}
# 对外端口与所有 HTTP 端点共用的路径前缀。
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /dedsi-arche-api
# 暴露基础运维端点，健康响应不显示内部连接细节。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 业务接口文档；页面由 Scalar 提供。
springdoc:
  api-docs:
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: false
  paths-to-match: /api/**
scalar:
  enabled: ${app.docs.enabled}
  url: /v3/api-docs
