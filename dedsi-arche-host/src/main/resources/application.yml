spring:
  application:
    name: dedsi-arche
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54329/dedsi_arche}
    username: ${DB_USER:dedsi}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:63799}
      password: ${REDIS_PASSWORD}
  flyway:
    locations: classpath:db/migration/system
app:
  docs:
    enabled: ${DOCS_ENABLED:true}
  jwt:
    issuer: dedsi-arche
    secret: ${JWT_SECRET}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: false
  paths-to-match: /api/**
scalar:
  enabled: ${app.docs.enabled}
  url: /v3/api-docs
