services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dedsi_arche
      POSTGRES_USER: dedsi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-local.ps1 first}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dedsi -d dedsi_arche"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init-local.ps1 first}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
